name: Check site

on:
  pull_request:
    branches: [main2]
  push:
    branches: [main2, words-pipeline]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check notes for Obsidian-only syntax and broken images
        run: pnpm run check:words

      - name: Build the site
        run: pnpm run build
